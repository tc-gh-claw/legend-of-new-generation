<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新世代傳說 | Legend of the New Generation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft JhengHei', '微軟正黑體', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
        }
        
        #game-container {
            position: relative;
            width: 800px;
            height: 600px;
            max-width: 100%;
            background: #000;
            border: 4px solid #e94560;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(233, 69, 96, 0.5);
        }
        
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        
        .game-title {
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-align: center;
            background: linear-gradient(90deg, #e94560, #ff6b6b, #feca57);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(233, 69, 96, 0.3);
        }
        
        .game-subtitle {
            font-size: 1rem;
            color: #a0a0a0;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.5rem;
            color: #e94560;
        }
        
        @media (max-width: 850px) {
            #game-container {
                width: 100%;
                height: auto;
                aspect-ratio: 4/3;
            }
            
            .game-title {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <h1 class="game-title">⚔️ 新世代傳說 ⚔️</h1>
    <p class="game-subtitle">Legend of the New Generation - 全科知識RPG冒險</p>
    
    <div id="game-container">
        <div class="loading">🎮 載入中...</div>
    </div>

    <!-- Phaser 3 Game Engine -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
    
    <!-- Game Scripts -->
    <script src="js/systems/AudioManager.js"></script>
    <script src="js/scenes/BootScene.js"></script>
    <script src="js/scenes/MenuScene.js"></script>
    <script src="js/scenes/SettingsScene.js"></script>
    <script src="js/scenes/WorldScene.js"></script>
    <script src="js/scenes/VillageScene.js"></script>
    <script src="js/scenes/ForestScene.js"></script>
    <script src="js/scenes/BossScene.js"></script>
    <script src="js/scenes/BattleScene.js"></script>
    <script src="js/scenes/QuizScene.js"></script>
    <script src="js/scenes/ShopScene.js"></script>
    <script src="js/scenes/InventorySystem.js"></script>
    <script src="js/scenes/QuestSystem.js"></script>
    <script src="js/scenes/LevelUpScene.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
